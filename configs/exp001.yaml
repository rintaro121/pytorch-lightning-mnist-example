run:
  seed: 42

data:
  data_dir: data
  batch_size: 128
  num_workers: 4
  persistent_workers: true

model:
  lr: 1.0e-3
  hidden_dim: 32

trainer:
  max_epochs: 10
  accelerator: auto
  devices: auto
  log_every_n_steps: 50

outputs:
  dir: outputs

checkpoint:
  monitor: val_acc
  mode: max
  save_top_k: 1
  filename: best-{epoch:02d}-{val_acc:.4f}

mlflow:
  experiment_name: mnist-classification
  run_name: exp001-mnist-mlp
  log_model: true
  tags:
    model: MLP
    dataset: MNIST
    config: exp001
